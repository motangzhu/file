<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
  <title>TKE 集群流量进出链路</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <text x="40" y="50" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#185FA5">① 外部流量进来（北向）</text>
    <g class="c-blue">
      <rect x="40" y="66" width="86" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="83" y="84" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#0C447C">公网用户</text>
    </g>
    <line x1="126" y1="84" x2="156" y2="84" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-blue">
      <rect x="160" y="66" width="104" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="212" y="84" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#0C447C">CLB</text>
    </g>
    <line x1="264" y1="76" x2="296" y2="64" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="264" y1="92" x2="296" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-gray">
      <rect x="300" y="46" width="150" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
      <text x="375" y="64" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#444441">NodePort Service</text>
      <text x="375" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">kube-proxy 写转发规则</text>
    </g>
    <line x1="450" y1="64" x2="480" y2="64" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-green">
      <rect x="484" y="46" width="76" height="36" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text x="522" y="64" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#27500A">Pod</text>
    </g>
    <g class="c-blue">
      <rect x="300" y="98" width="150" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="375" y="116" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#0C447C">CLB 直通 Pod</text>
    </g>
    <line x1="450" y1="116" x2="480" y2="116" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-green">
      <rect x="484" y="98" width="76" height="36" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text x="522" y="116" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#27500A">Pod</text>
    </g>
    <text x="576" y="64" font-family="sans-serif" font-size="11" fill="#888780">七层可经 Ingress</text>
    <text x="576" y="116" font-family="sans-serif" font-size="11" fill="#888780">少一跳 NodePort</text>
  </g>

  <g>
    <text x="40" y="182" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#854F0B">② 集群流量出去（南向）</text>
    <g class="c-green">
      <rect x="40" y="214" width="86" height="36" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text x="83" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#27500A">Pod</text>
    </g>
    <line x1="126" y1="222" x2="160" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="126" y1="242" x2="160" y2="252" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-amber">
      <rect x="164" y="196" width="170" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text x="249" y="212" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#633806">NAT 网关</text>
      <text x="249" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">统一出口 · 出口 IP 固定</text>
    </g>
    <g class="c-amber">
      <rect x="164" y="246" width="170" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text x="249" y="262" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#633806">EIP</text>
      <text x="249" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">单独绑定 · 一对一直达</text>
    </g>
    <line x1="334" y1="214" x2="364" y2="226" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="334" y1="264" x2="364" y2="250" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-gray">
      <rect x="368" y="218" width="80" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
      <text x="408" y="236" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#444441">公网</text>
    </g>
  </g>

  <g>
    <text x="40" y="316" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#993556">③ 跨 VPC 互通（东西向组网）</text>
    <g class="c-pink">
      <rect x="40" y="348" width="120" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
      <text x="100" y="366" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#72243E">本集群 VPC</text>
    </g>
    <line x1="160" y1="356" x2="192" y2="346" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="160" y1="376" x2="192" y2="386" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-pink">
      <rect x="196" y="328" width="180" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
      <text x="286" y="344" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#72243E">云联网 CEN</text>
      <text x="286" y="357" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993556">中心化 · 路由自动下发 · 跨地域</text>
    </g>
    <g class="c-pink">
      <rect x="196" y="378" width="180" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
      <text x="286" y="394" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#72243E">对等连接</text>
      <text x="286" y="407" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993556">点对点打通 · 路由手动维护</text>
    </g>
    <line x1="376" y1="346" x2="406" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="376" y1="396" x2="406" y2="382" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-pink">
      <rect x="410" y="358" width="110" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
      <text x="465" y="376" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#72243E">对端 VPC</text>
    </g>
    <text x="540" y="352" font-family="sans-serif" font-size="11" fill="#888780">专线/云下 IDC</text>
    <text x="540" y="368" font-family="sans-serif" font-size="11" fill="#888780">也可经云联网接入</text>
  </g>

  <rect x="40" y="434" width="600" height="1" fill="#D3D1C7"/>
  <text x="40" y="456" font-family="sans-serif" font-size="12" fill="#5F5E5A">排查顺序沿链路走：云原生网关 → CLB → CEN 云联网 → NAT → 安全组/CFW 策略 → 目标服务</text>
</svg>
