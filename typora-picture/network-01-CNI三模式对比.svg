<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
  <title>CNI 三种网络模式对比</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="36" width="190" height="350" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="40" y="36" width="190" height="36" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="135" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">VPC-CNI（推荐）</text>
    <text x="52" y="88" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#185FA5">IP 来源</text>
    <text x="52" y="105" font-family="sans-serif" font-size="12" fill="#2C2C2A">VPC 子网弹性网卡</text>
    <text x="52" y="121" font-family="sans-serif" font-size="12" fill="#2C2C2A">Pod 持有真实 VPC IP</text>
    <text x="52" y="150" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#185FA5">网络平面</text>
    <text x="52" y="167" font-family="sans-serif" font-size="12" fill="#2C2C2A">与节点同一 VPC 平面</text>
    <text x="52" y="183" font-family="sans-serif" font-size="12" fill="#2C2C2A">直接用 EIP/CLB/安全组</text>
    <text x="52" y="212" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#185FA5">适用场景</text>
    <text x="52" y="229" font-family="sans-serif" font-size="12" fill="#2C2C2A">低时延要求</text>
    <text x="52" y="245" font-family="sans-serif" font-size="12" fill="#2C2C2A">需要 Pod 固定 IP</text>
    <text x="52" y="274" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#185FA5">主要限制</text>
    <text x="52" y="291" font-family="sans-serif" font-size="12" fill="#2C2C2A">IP 受子网/单卡数限制</text>
    <text x="52" y="307" font-family="sans-serif" font-size="12" fill="#2C2C2A">固定 IP 不跨可用区</text>
    <text x="52" y="336" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#185FA5">关键能力</text>
    <text x="52" y="353" font-family="sans-serif" font-size="12" fill="#2C2C2A">CLB 直通 Pod：支持</text>
    <text x="52" y="369" font-family="sans-serif" font-size="12" fill="#2C2C2A">Pod 固定 IP：支持</text>
  </g>

  <g>
    <rect x="245" y="36" width="190" height="350" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <rect x="245" y="36" width="190" height="36" rx="10" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">GlobalRouter</text>
    <text x="257" y="88" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#5F5E5A">IP 来源</text>
    <text x="257" y="105" font-family="sans-serif" font-size="12" fill="#2C2C2A">独立容器网段</text>
    <text x="257" y="121" font-family="sans-serif" font-size="12" fill="#2C2C2A">非 VPC 子网地址</text>
    <text x="257" y="150" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#5F5E5A">网络平面</text>
    <text x="257" y="167" font-family="sans-serif" font-size="12" fill="#2C2C2A">跨节点走全局路由</text>
    <text x="257" y="183" font-family="sans-serif" font-size="12" fill="#2C2C2A">网段须避开节点网段</text>
    <text x="257" y="212" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#5F5E5A">适用场景</text>
    <text x="257" y="229" font-family="sans-serif" font-size="12" fill="#2C2C2A">业务简单</text>
    <text x="257" y="245" font-family="sans-serif" font-size="12" fill="#2C2C2A">无特殊 IP/性能需求</text>
    <text x="257" y="274" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#5F5E5A">主要限制</text>
    <text x="257" y="291" font-family="sans-serif" font-size="12" fill="#2C2C2A">跨 VPC 互通需额外配置</text>
    <text x="257" y="307" font-family="sans-serif" font-size="12" fill="#2C2C2A">老教程说的默认已过时</text>
    <text x="257" y="336" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#5F5E5A">关键能力</text>
    <text x="257" y="353" font-family="sans-serif" font-size="12" fill="#2C2C2A">CLB 直通 Pod：需白名单</text>
    <text x="257" y="369" font-family="sans-serif" font-size="12" fill="#2C2C2A">Pod 固定 IP：不支持</text>
  </g>

  <g>
    <rect x="450" y="36" width="190" height="350" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <rect x="450" y="36" width="190" height="36" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
    <text x="545" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Cilium-Overlay</text>
    <text x="462" y="88" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#534AB7">IP 来源</text>
    <text x="462" y="105" font-family="sans-serif" font-size="12" fill="#2C2C2A">VxLAN 隧道 Overlay 网段</text>
    <text x="462" y="121" font-family="sans-serif" font-size="12" fill="#2C2C2A">地址充裕</text>
    <text x="462" y="150" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#534AB7">网络平面</text>
    <text x="462" y="167" font-family="sans-serif" font-size="12" fill="#2C2C2A">与节点不在同一平面</text>
    <text x="462" y="183" font-family="sans-serif" font-size="12" fill="#2C2C2A">适合云上云下互通</text>
    <text x="462" y="212" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#534AB7">适用场景</text>
    <text x="462" y="229" font-family="sans-serif" font-size="12" fill="#2C2C2A">仅云下注册节点</text>
    <text x="462" y="245" font-family="sans-serif" font-size="12" fill="#2C2C2A">（IDC 机器入云）</text>
    <text x="462" y="274" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#534AB7">主要限制</text>
    <text x="462" y="291" font-family="sans-serif" font-size="12" fill="#2C2C2A">约 10% 性能损耗</text>
    <text x="462" y="307" font-family="sans-serif" font-size="12" fill="#2C2C2A">集群外不能直访 Pod IP</text>
    <text x="462" y="336" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#534AB7">关键能力</text>
    <text x="462" y="353" font-family="sans-serif" font-size="12" fill="#2C2C2A">CLB 直通 Pod：不支持</text>
    <text x="462" y="369" font-family="sans-serif" font-size="12" fill="#2C2C2A">与超级节点池互斥</text>
  </g>

  <g>
    <rect x="40" y="404" width="600" height="46" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="56" y="421" font-family="sans-serif" font-size="12" fill="#444441">三种 CNI 模式在创建集群时选定，存量集群基本无法切换</text>
    <text x="56" y="438" font-family="sans-serif" font-size="12" fill="#444441">注意：CNI 方案 不等于 Service 转发模式（iptables / IPVS / Dataplane V2 是另一个层面）</text>
  </g>
</svg>
