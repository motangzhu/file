<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="100%" role="img">
  <title>Kong 与 TKE 的两条对接路线</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="36" width="290" height="304" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="185" y="60" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#0C447C">路线 A：服务来源模式</text>
    <g class="c-blue">
      <rect x="100" y="76" width="170" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
      <text x="185" y="92" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#0C447C">TSE 托管 Kong</text>
      <text x="185" y="107" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">腾讯云控制台购买的实例</text>
    </g>
    <line x1="185" y1="120" x2="185" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-gray">
      <rect x="100" y="154" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
      <text x="185" y="170" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#444441">业务集群 Service</text>
      <text x="185" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Kong watch 服务来源</text>
    </g>
    <line x1="185" y1="198" x2="185" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-green">
      <rect x="100" y="232" width="170" height="36" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text x="185" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#27500A">业务 Pod</text>
    </g>
    <path d="M96 176 C 56 176 56 98 96 98" fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="52" y="140" font-family="sans-serif" font-size="11" fill="#185FA5">watch</text>
    <text x="56" y="296" font-family="sans-serif" font-size="12" fill="#2C2C2A">网关在集群外，不动业务集群</text>
    <text x="56" y="316" font-family="sans-serif" font-size="12" fill="#2C2C2A">路由在 Kong 侧 / Konga 配置</text>
  </g>

  <g>
    <rect x="350" y="36" width="290" height="304" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="495" y="60" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#085041">路线 B：集群内部署 KIC</text>
    <g class="c-teal">
      <rect x="410" y="76" width="170" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="495" y="92" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#085041">Kong Ingress Controller</text>
      <text x="495" y="107" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">Kong Gateway Pod 跑在集群内</text>
    </g>
    <line x1="495" y1="120" x2="495" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-gray">
      <rect x="410" y="154" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
      <text x="495" y="170" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#444441">业务集群 Service</text>
      <text x="495" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">watch Ingress/Gateway CRD</text>
    </g>
    <line x1="495" y1="198" x2="495" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g class="c-green">
      <rect x="410" y="232" width="170" height="36" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text x="495" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#27500A">业务 Pod</text>
    </g>
    <path d="M406 176 C 366 176 366 98 406 98" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="362" y="140" font-family="sans-serif" font-size="11" fill="#0F6E56">watch</text>
    <text x="366" y="296" font-family="sans-serif" font-size="12" fill="#2C2C2A">路由随 K8s 资源声明式管理</text>
    <text x="366" y="316" font-family="sans-serif" font-size="12" fill="#2C2C2A">yaml 改 Ingress/HTTPRoute 即生效</text>
  </g>

  <g>
    <rect x="40" y="360" width="600" height="70" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="56" y="378" font-family="sans-serif" font-size="12" fill="#444441">两条路线可并存：同一组业务 Pod 可以同时有 Kong 入口与 Ingress 入口</text>
    <text x="56" y="396" font-family="sans-serif" font-size="12" fill="#444441">托管 KIC 支持多集群的版本仅 2.7.0（2026-09 核实），其余版本只支持单集群</text>
    <text x="56" y="414" font-family="sans-serif" font-size="12" fill="#444441">同名不同物：TSE 托管 Kong、开源 Kong、KIC 是三种身份，选型前先分清</text>
  </g>
</svg>
